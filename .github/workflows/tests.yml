name: Offline regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    strategy:
      matrix:
        engine: [powershell.exe, pwsh]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Installer lifecycle and security regressions
        shell: pwsh
        run: python tests/test_install.py --pwsh "${{ matrix.engine }}"
  watchdog:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Watchdog logic with inert UI APIs
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File tests/Test-Watchdog.ps1
